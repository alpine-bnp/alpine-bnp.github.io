name: Check and build the website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the one-page site
        run: node build.mjs
      - name: Check page links and assets
        run: node scripts/validate.mjs
      - name: Save the private website preview files
        uses: actions/upload-artifact@v7
        with:
          name: alpine-bnp-website
          path: dist/
          if-no-files-found: error
          retention-days: 7
